theme="dark-synthwave"
[editor]
line-number = "relative"
cursorline = true
rulers = [90]
auto-completion = true
true-color = true
gutters = ["line-numbers", "spacer", "diff"]
# gutters = ["diagnostics", "line-numbers", "spacer", "diff"]
color-modes = true
# bufferline = "always"
idle-timeout=0
completion-trigger-len = 1

[editor.soft-wrap]
enable = true

[editor.statusline]
left = ["mode", "file-name", "spinner"]
center = []
#right = ["diagnostics", "selections", "position", "file-encoding", "file-line-ending", "file-type"]
right = ["diagnostics", "position", "file-type"]
separator = "│"
mode.normal = "N"
mode.insert = "I"
mode.select = "C"
# patch 12204 from Nik-rev
# merge-with-commandline = true

[editor.lsp]
enable = true
auto-signature-help    = false

# [editor.smart-tab]
# enable = false

[editor.inline-diagnostics]
cursor-line = "hint"

[editor.indent-guides]
# render = true
character = "."
skip-levels = 0

[keys.normal]
# https://github.com/sxyazi/yazi/pull/2461
C-y = [ ':sh rm -f /tmp/yazi-path', ':insert-output yazi %{buffer_name} --chooser-file=/tmp/yazi-path', ":open %sh{cat /tmp/yazi-path}", ":redraw" ]
C-s = ":w"
C-b = ["keep_primary_selection", "collapse_selection"]
X = "extend_line_up"
D = "delete_char_forward"
tab = ":buffer-next"
S-tab = ":buffer-previous"
C-n = "move_line_down"
C-p = "move_line_up"
# emulate key press
Y =  "@xy;"
y = "yank_joined"

[keys.normal." "]
q = ":buffer-close"
" " = "buffer_picker"
o = "file_picker_in_current_buffer_directory"

# macro commands for lsp
# we don't want to modify the original command we are trying to run in the first place
# so I will try to have my macro on CAPS keybinds
[keys.normal.g]
D = "@ wvgd"

[keys.insert]
"C-[" = "normal_mode"
C-l = "move_char_right"
C-s = "signature_help"
C-n = "move_line_down"
C-p = "move_line_up"
C-b = "move_char_left"
C-f = "move_char_right"
S-tab = "move_parent_node_start"

[keys.normal."["]
w = ":lsp-workspace-command"
